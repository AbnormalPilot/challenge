<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-label="Bertrand's Paradox — three methods">
  <rect width="780" height="280" fill="#000"/>
  <!-- Title -->
  <text x="390" y="28" fill="#ffffff" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Bertrand's Paradox — same question, three answers</text>

  <!-- Panel 1: Random Endpoints @ center (130, 160), r=80 -->
  <g transform="translate(0, 0)">
    <circle cx="130" cy="160" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
    <polygon points="130,80 199.28,200 60.72,200" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- endpoints at -50° and 110° -->
    <path d="M 181.42 98.72 A 80 80 0 0 1 102.64 235.17" fill="none" stroke="#3ddc97" stroke-width="3.5" opacity="0.9"/>
    <line x1="130" y1="160" x2="181.42" y2="98.72" stroke="#2997ff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="130" y1="160" x2="102.64" y2="235.17" stroke="#2997ff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="181.42" y1="98.72" x2="102.64" y2="235.17" stroke="#3ddc97" stroke-width="2.2"/>
    <circle cx="181.42" cy="98.72" r="4.5" fill="#2997ff"/>
    <circle cx="102.64" cy="235.17" r="4.5" fill="#2997ff"/>
    <text x="130" y="258" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Random Endpoints</text>
    <text x="130" y="274" fill="#2997ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">P = 1/3</text>
  </g>

  <!-- Panel 2: Random Radius @ center (390, 160), r=80 -->
  <g transform="translate(260, 0)">
    <circle cx="130" cy="160" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
    <polygon points="130,80 199.28,200 60.72,200" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- radius angle 45°: B = (130+56.57, 160+56.57) = (186.57, 216.57); M at d=0.35: (150.12, 180.12) -->
    <line x1="130" y1="160" x2="186.57" y2="216.57" stroke="#2997ff" stroke-opacity="0.75" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- perp: (-0.707, 0.707); half = 80*sqrt(1-0.1225) = 74.93 -->
    <!-- endpoints: M ± half*perp → (150.12 - 52.98, 180.12 + 52.98) = (97.14, 233.10); (203.10, 127.14) -->
    <line x1="97.14" y1="233.10" x2="203.10" y2="127.14" stroke="#3ddc97" stroke-width="2.4"/>
    <circle cx="150.12" cy="180.12" r="4.5" fill="#2997ff"/>
    <text x="130" y="258" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Random Radius</text>
    <text x="130" y="274" fill="#2997ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">P = 1/2</text>
  </g>

  <!-- Panel 3: Random Midpoint @ center (650, 160) -->
  <g transform="translate(520, 0)">
    <circle cx="130" cy="160" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
    <polygon points="130,80 199.28,200 60.72,200" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- inner disk r=40 -->
    <circle cx="130" cy="160" r="40" fill="#2997ff" fill-opacity="0.05" stroke="#2997ff" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- M at d=0.4, angle 210°: (130 - 27.71, 160 - 16) = (102.29, 144) -->
    <!-- perp to radius (cos210,sin210)=(-0.866,-0.5): perp=(0.5,-0.866); half=80*sqrt(0.84)=73.32 -->
    <!-- endpoints: M+half*perp=(139.11, 80.50), M-half*perp=(65.47, 207.50) -->
    <line x1="139.11" y1="80.50" x2="65.47" y2="207.50" stroke="#3ddc97" stroke-width="2.4"/>
    <line x1="130" y1="160" x2="102.29" y2="144" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="102.29" cy="144" r="4.5" fill="#2997ff"/>
    <text x="130" y="258" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Random Midpoint</text>
    <text x="130" y="274" fill="#2997ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">P = 1/4</text>
  </g>
</svg>
