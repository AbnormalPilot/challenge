<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-label="Integral verification of the three probabilities">
  <rect width="680" height="220" fill="#000"/>
  <style>
    .base { font-family: "Latin Modern Math", "Cambria Math", "STIX Two Math", Georgia, "Times New Roman", serif; fill: #ffffff; }
    .var  { font-style: italic; }
    .res  { fill: #3ddc97; font-weight: 700; }
    .label { fill: #9aa3b2; font-size: 13px; font-family: -apple-system, "Helvetica Neue", sans-serif; }
  </style>
  <g class="base" font-size="22">
    <text x="24" y="28" class="label">Direct integration of each density on [0, 1/2]</text>

    <!-- Method 1 -->
    <text x="30" y="72">
      <tspan>P</tspan>
      <tspan baseline-shift="sub" font-size="14">1</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10" font-size="28">∫</tspan>
      <tspan baseline-shift="sub" font-size="12">0</tspan>
      <tspan baseline-shift="super" font-size="12">1/2</tspan>
      <tspan dx="8">2 / ( π √( 1 − </tspan>
      <tspan class="var">d</tspan>
      <tspan baseline-shift="super" font-size="14">2</tspan>
      <tspan> ) ) </tspan>
      <tspan class="var"> d</tspan>
      <tspan class="var">d</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10">(2/π) · arcsin(1/2)</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10" class="res">1 / 3</tspan>
    </text>

    <!-- Method 2 -->
    <text x="30" y="128">
      <tspan>P</tspan>
      <tspan baseline-shift="sub" font-size="14">2</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10" font-size="28">∫</tspan>
      <tspan baseline-shift="sub" font-size="12">0</tspan>
      <tspan baseline-shift="super" font-size="12">1/2</tspan>
      <tspan dx="8">1 </tspan>
      <tspan class="var"> d</tspan>
      <tspan class="var">d</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10" class="res">1 / 2</tspan>
    </text>

    <!-- Method 3 -->
    <text x="30" y="184">
      <tspan>P</tspan>
      <tspan baseline-shift="sub" font-size="14">3</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10" font-size="28">∫</tspan>
      <tspan baseline-shift="sub" font-size="12">0</tspan>
      <tspan baseline-shift="super" font-size="12">1/2</tspan>
      <tspan dx="8">2</tspan>
      <tspan class="var">d</tspan>
      <tspan class="var"> d</tspan>
      <tspan class="var">d</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10">[ </tspan>
      <tspan class="var">d</tspan>
      <tspan baseline-shift="super" font-size="14">2</tspan>
      <tspan> ]</tspan>
      <tspan baseline-shift="sub" font-size="12">0</tspan>
      <tspan baseline-shift="super" font-size="12">1/2</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10" class="res">1 / 4</tspan>
    </text>
  </g>
</svg>
