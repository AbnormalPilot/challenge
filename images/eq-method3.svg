<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="Method 3 derivation">
  <rect width="620" height="170" fill="#000"/>
  <style>
    .base { font-family: "Latin Modern Math", "Cambria Math", "STIX Two Math", Georgia, "Times New Roman", serif; fill: #ffffff; }
    .var  { font-style: italic; }
    .hi   { fill: #2997ff; font-weight: 600; }
    .res  { fill: #3ddc97; font-weight: 700; }
    .label { fill: #9aa3b2; font-size: 13px; font-family: -apple-system, "Helvetica Neue", sans-serif; }
  </style>
  <g class="base" font-size="22">
    <text x="24" y="30" class="label">M ~ Uniform over disk;  D = |OM|;  long ⇔ D &lt; 1/2</text>
    <text x="30" y="70">
      <tspan>P</tspan>
      <tspan baseline-shift="sub" font-size="14">3</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10">area of disk radius 1/2</tspan>
    </text>
    <line x1="112" y1="82" x2="380" y2="82" stroke="#ffffff" stroke-width="1.3"/>
    <text x="112" y="106">
      <tspan>area of disk radius 1</tspan>
    </text>
    <text x="395" y="92">
      <tspan>=</tspan>
      <tspan dx="10">π · (1/2)</tspan>
      <tspan baseline-shift="super" font-size="14">2</tspan>
      <tspan dx="6">/</tspan>
      <tspan dx="6">π · 1</tspan>
      <tspan baseline-shift="super" font-size="14">2</tspan>
    </text>

    <text x="24" y="140" class="label">Result</text>
    <text x="30" y="162" font-size="24">
      <tspan class="res">P</tspan>
      <tspan baseline-shift="sub" font-size="14" class="res">3</tspan>
      <tspan dx="10" class="res">=</tspan>
      <tspan dx="10" class="res">1 / 4</tspan>
      <tspan dx="10" class="res">= 0.250</tspan>
    </text>
  </g>
</svg>
