<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" role="img" aria-label="Method 2 derivation">
  <rect width="620" height="160" fill="#000"/>
  <style>
    .base { font-family: "Latin Modern Math", "Cambria Math", "STIX Two Math", Georgia, "Times New Roman", serif; fill: #ffffff; }
    .var  { font-style: italic; }
    .hi   { fill: #2997ff; font-weight: 600; }
    .res  { fill: #3ddc97; font-weight: 700; }
    .label { fill: #9aa3b2; font-size: 13px; font-family: -apple-system, "Helvetica Neue", sans-serif; }
  </style>
  <g class="base" font-size="22">
    <text x="24" y="30" class="label">Sampling: direction θ and distance d along radius, d ~ Uniform[0, 1]</text>
    <text x="30" y="62">
      <tspan>|</tspan><tspan class="var">ℓ</tspan><tspan>|</tspan>
      <tspan dx="6">&gt;</tspan>
      <tspan dx="6">√3</tspan>
      <tspan dx="14" class="hi">⇔</tspan>
      <tspan dx="10" class="var">d</tspan>
      <tspan dx="6">&lt;</tspan>
      <tspan dx="6">1/2</tspan>
    </text>

    <text x="24" y="102" class="label">Probability</text>
    <text x="30" y="134">
      <tspan>P</tspan>
      <tspan baseline-shift="sub" font-size="14">2</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10">P( </tspan>
      <tspan class="var">d</tspan>
      <tspan dx="6">&lt;</tspan>
      <tspan dx="6">1/2 )</tspan>
      <tspan dx="14">=</tspan>
      <tspan dx="10" class="res">1 / 2</tspan>
      <tspan dx="10" class="res">= 0.500</tspan>
    </text>
  </g>
</svg>
