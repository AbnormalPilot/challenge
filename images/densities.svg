<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="Induced densities of d for each method">
  <rect width="520" height="340" fill="#000"/>
  <text x="260" y="22" fill="#ffffff" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Induced density of d = perpendicular distance from center</text>

  <!-- Plot area: x [60, 460] = d [0, 1]; y [250, 30] = f [0, 2.5] -->

  <!-- Critical region d < 1/2 shaded fills (areas = probabilities) -->
  <!-- Method 3: triangle under 2d from 0 to 1/2: f(0)=0, f(0.5)=1 → P=0.25 -->
  <path d="M 60 250 L 260 162 L 260 250 Z" fill="#ff6b6b" fill-opacity="0.18"/>
  <!-- Method 2: constant rectangle under f=1 from 0 to 1/2: P=0.5 -->
  <path d="M 60 162 L 260 162 L 260 250 L 60 250 Z" fill="#2997ff" fill-opacity="0.12"/>
  <!-- Method 1: area under curve 2/(π√(1-d²)) from 0 to 1/2: P=0.333 -->
  <path d="M 60 194 L 80 194 L 100 193.7 L 140 192.8 L 180 191.3 L 220 188.8 L 260 185.3 L 260 250 L 60 250 Z" fill="#3ddc97" fill-opacity="0.18"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1">
    <line x1="60" y1="30" x2="60" y2="250"/>
    <line x1="460" y1="30" x2="460" y2="250"/>
    <line x1="60" y1="250" x2="460" y2="250"/>
    <line x1="60" y1="30" x2="460" y2="30"/>
  </g>

  <!-- d = 1/2 critical vertical -->
  <line x1="260" y1="30" x2="260" y2="250" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="260" y="275" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle" font-weight="700">d = 1/2 (long-chord threshold)</text>

  <!-- x axis ticks + labels -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="1">
    <line x1="60" y1="250" x2="60" y2="254"/>
    <line x1="160" y1="250" x2="160" y2="254"/>
    <line x1="260" y1="250" x2="260" y2="254"/>
    <line x1="360" y1="250" x2="360" y2="254"/>
    <line x1="460" y1="250" x2="460" y2="254"/>
  </g>
  <g fill="#9aa3b2" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">
    <text x="60" y="265">0</text>
    <text x="160" y="265">0.25</text>
    <text x="360" y="265">0.75</text>
    <text x="460" y="265">1</text>
  </g>

  <!-- y axis ticks + labels (f = 0, 0.5, 1, 1.5, 2, 2.5) -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="1">
    <line x1="56" y1="250" x2="60" y2="250"/>
    <line x1="56" y1="206" x2="60" y2="206"/>
    <line x1="56" y1="162" x2="60" y2="162"/>
    <line x1="56" y1="118" x2="60" y2="118"/>
    <line x1="56" y1="74" x2="60" y2="74"/>
    <line x1="56" y1="30" x2="60" y2="30"/>
  </g>
  <g fill="#9aa3b2" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">
    <text x="52" y="253">0</text>
    <text x="52" y="209">0.5</text>
    <text x="52" y="165">1</text>
    <text x="52" y="121">1.5</text>
    <text x="52" y="77">2</text>
    <text x="52" y="33">2.5</text>
  </g>

  <!-- Method 3: f = 2d (linear) -->
  <path d="M 60 250 L 460 74" fill="none" stroke="#ff6b6b" stroke-width="2.2"/>
  <!-- Method 2: f = 1 (constant) -->
  <path d="M 60 162 L 460 162" fill="none" stroke="#2997ff" stroke-width="2.2"/>
  <!-- Method 1: f = 2/(π√(1-d²)) -->
  <path d="M 60 194 L 80 194 L 100 193.7 L 140 192.8 L 180 191.3 L 220 188.8 L 260 185.3 L 300 180.0 L 340 171.5 L 380 156.6 L 400 143.6 L 420 121.5 L 432 97.6 L 440 70.6 L 446.8 30" fill="none" stroke="#3ddc97" stroke-width="2.2"/>

  <!-- Axis labels -->
  <text x="260" y="304" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">d — perpendicular distance from center</text>
  <text x="14" y="140" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 14 140)">density f(d)</text>

  <!-- Legend -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11">
    <rect x="300" y="320" width="14" height="3" fill="#3ddc97"/>
    <text x="320" y="325" fill="#ffffff">M1: 2/(π√(1−d²))  → P = 1/3</text>
  </g>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11">
    <rect x="60" y="320" width="14" height="3" fill="#2997ff"/>
    <text x="80" y="325" fill="#ffffff">M2: 1  → P = 1/2</text>
  </g>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11">
    <rect x="180" y="320" width="14" height="3" fill="#ff6b6b"/>
    <text x="200" y="325" fill="#ffffff">M3: 2d  → P = 1/4</text>
  </g>
</svg>
