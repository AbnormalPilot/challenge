<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-label="Induced densities on d for each method">
  <rect width="620" height="180" fill="#000"/>
  <style>
    .base { font-family: "Latin Modern Math", "Cambria Math", "STIX Two Math", Georgia, "Times New Roman", serif; fill: #ffffff; }
    .var  { font-style: italic; }
    .label { fill: #9aa3b2; font-size: 13px; font-family: -apple-system, "Helvetica Neue", sans-serif; }
    .m1 { fill: #3ddc97; font-weight: 700; }
    .m2 { fill: #2997ff; font-weight: 700; }
    .m3 { fill: #ff6b6b; font-weight: 700; }
  </style>
  <g class="base" font-size="22">
    <text x="24" y="28" class="label">Induced densities of d (perpendicular distance from center)</text>

    <!-- Method 1 density: 2 / (π √(1 − d²)) -->
    <text x="30" y="68" class="m1">Method 1</text>
    <text x="160" y="62">
      <tspan class="var">f</tspan>
      <tspan baseline-shift="sub" font-size="14">D,1</tspan>
      <tspan>(</tspan>
      <tspan class="var">d</tspan>
      <tspan>)</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10">2</tspan>
    </text>
    <line x1="260" y1="75" x2="380" y2="75" stroke="#ffffff" stroke-width="1.3"/>
    <text x="260" y="98">
      <tspan>π · √( 1 − </tspan>
      <tspan class="var">d</tspan>
      <tspan baseline-shift="super" font-size="14">2</tspan>
      <tspan> )</tspan>
    </text>

    <!-- Method 2 density: 1 -->
    <text x="30" y="128" class="m2">Method 2</text>
    <text x="160" y="128">
      <tspan class="var">f</tspan>
      <tspan baseline-shift="sub" font-size="14">D,2</tspan>
      <tspan>(</tspan>
      <tspan class="var">d</tspan>
      <tspan>)</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10">1</tspan>
    </text>

    <!-- Method 3 density: 2d -->
    <text x="30" y="160" class="m3">Method 3</text>
    <text x="160" y="160">
      <tspan class="var">f</tspan>
      <tspan baseline-shift="sub" font-size="14">D,3</tspan>
      <tspan>(</tspan>
      <tspan class="var">d</tspan>
      <tspan>)</tspan>
      <tspan dx="10">=</tspan>
      <tspan dx="10">2</tspan>
      <tspan class="var">d</tspan>
    </text>
  </g>
</svg>
