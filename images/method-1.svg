<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Method 1: Random Endpoints">
  <rect width="240" height="240" fill="#000"/>
  <!-- outer circle -->
  <circle cx="120" cy="120" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
  <!-- inscribed equilateral triangle -->
  <polygon points="120,30 197.94,165 42.06,165" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <!-- example endpoints (long chord, arc ~160°) -->
  <!-- P1 at angle -50°: (120 + 90*cos(-50°), 120 + 90*sin(-50°)) ≈ (177.85, 50.06) -->
  <!-- P2 at angle 110°:  (120 + 90*cos(110°), 120 + 90*sin(110°)) ≈ (89.22, 204.57) -->
  <!-- minor arc highlight (long, > 120°) -->
  <path d="M 177.85 50.06 A 90 90 0 0 1 89.22 204.57" fill="none" stroke="#3ddc97" stroke-width="4" opacity="0.9"/>
  <!-- wedge dashed lines from center to endpoints -->
  <line x1="120" y1="120" x2="177.85" y2="50.06" stroke="#2997ff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="120" x2="89.22" y2="204.57" stroke="#2997ff" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- chord -->
  <line x1="177.85" y1="50.06" x2="89.22" y2="204.57" stroke="#3ddc97" stroke-width="2.4" opacity="0.95"/>
  <!-- endpoint dots -->
  <circle cx="177.85" cy="50.06" r="5" fill="#2997ff"/>
  <circle cx="89.22" cy="204.57" r="5" fill="#2997ff"/>
  <!-- angle label at bisector -->
  <text x="120" y="118" fill="#3ddc97" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">160°</text>
  <text x="120" y="134" fill="#9aa3b2" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">&gt; 120° → long</text>
  <!-- caption -->
  <text x="120" y="228" fill="#ffffff" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Method 1 · Random Endpoints · P = 1/3</text>
</svg>
